<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#05070a">
  <title>WAQI Admin · Sign in</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2305070a'/%3E%3Cpath d='M12 20h12v12H12zm28 0h12v12H40zM12 44h12v8H12zm36-8h4v16h-8v-8h4z' fill='%23ff5a1f'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./login.js"></script>
</head>
<body class="login-body">
  <main class="login-card" aria-labelledby="login-title">
    <a class="admin-brand" href="../landing/" aria-label="WAQI">
      <span class="admin-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span><strong>WAQI</strong><small>Campaign console</small></span>
    </a>
    <p class="admin-eyebrow">ADMIN ONLY</p>
    <h1 id="login-title">Sign in</h1>
    <p class="login-intro">Use the single Supabase admin account. The public campaign does not need a login.</p>
    <form id="login-form" class="form-grid">
      <label>Email
        <input id="login-email" type="email" autocomplete="username" required>
      </label>
      <label>Password
        <input id="login-password" type="password" autocomplete="current-password" required>
      </label>
      <button class="primary-button" id="login-submit" type="submit">Sign in</button>
      <p class="form-status" id="login-status" role="alert"></p>
    </form>
    <p class="login-back"><a href="../landing/">← Back to the campaign</a></p>
  </main>
</body>
</html>
